<svg width="120" height="120" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <!-- Glowing Effect -->
    <defs>
        <filter id="glow">
            <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>
    
    <!-- Shield Body -->
    <path d="M50 5 L90 20 V50 C90 75 50 95 50 95 C50 95 10 75 10 50 V20 L50 5 Z" 
          fill="rgba(0,0,0,0.5)" 
          stroke="#00f260" 
          stroke-width="3"
          filter="url(#glow)"/>
          
    <!-- Lock Icon / Cross -->
    <path d="M50 35 V65 M35 50 H65" 
          stroke="#4facfe" 
          stroke-width="4" 
          filter="url(#glow)"/>
    
    <!-- Tech Accents -->
    <circle cx="50" cy="50" r="35" stroke="#00f260" stroke-width="1" fill="none" opacity="0.5" stroke-dasharray="5,5"/>
</svg>
